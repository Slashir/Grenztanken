# Optional: legt die EU-Wochendurchschnitte für Tschechien und Polen einmal pro Woche im Repo ab.
# Die App liest sie dann von hier statt direkt von fuel-prices.eu (siehe Config.EU_RELAY_BASE_URL).
# Quelle: EU Weekly Oil Bulletin über fuel-prices.eu, CC BY 4.0.
name: EU-Wochenpreise

on:
  schedule:
    # Freitags 06:17 UTC; das Bulletin erscheint donnerstags.
    - cron: "17 6 * * 5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Daten holen und prüfen
        run: |
          mkdir -p data
          for cc in CZ PL; do
            curl -fsS -A "Grenztanken-Relay (GitHub Actions)" \
              "https://www.fuel-prices.eu/lang/api/country-history.php?cc=$cc" -o "data/eu-$cc.json.new"
            # Nur übernehmen, wenn die Antwort die erwarteten Felder hat.
            jq -e '.labels | length > 0' "data/eu-$cc.json.new" > /dev/null
            jq -e '.e95 | length > 0' "data/eu-$cc.json.new" > /dev/null
            jq -e '.diesel | length > 0' "data/eu-$cc.json.new" > /dev/null
            mv "data/eu-$cc.json.new" "data/eu-$cc.json"
          done

      - name: Änderungen einchecken
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/eu-*.json
          git diff --cached --quiet || git commit -m "EU-Wochenpreise aktualisiert"
          git push
