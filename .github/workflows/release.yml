# Veröffentlicht eine Version: Tag "v0.5.0" pushen (oder hier manuell starten),
# dann baut der Workflow die signierte APK und hängt sie an ein GitHub-Release.
# Voraussetzung: die vier SIGNING_*-Secrets (siehe README, "Signierte Release-Version").
name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag der Version, z. B. v0.5.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Signatur-Secrets prüfen
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret SIGNING_KEYSTORE_BASE64 fehlt. Ohne festen Schlüssel lassen sich Updates nicht installieren."
            exit 1
          fi

      - name: Tests und signierte APK
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export SIGNING_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          ./gradlew testReleaseUnitTest assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "grenztanken-$TAG.apk"
          # Zusätzlich unter festem Namen, damit .../releases/latest/download/grenztanken.apk immer funktioniert.
          cp app/build/outputs/apk/release/app-release.apk grenztanken.apk

      - name: Text für die Release-Seite
        run: |
          cat > notes.md <<EOF
          Dir hilft die App? Über Ko-fi kannst du mir einen Kaffee ausgeben:

          [![Unterstütze Slashir auf Ko-fi](https://ko-fi.com/img/githubbutton_sm.svg)](https://ko-fi.com/slashir)

          ## Installation

          1. Unten unter **Assets** auf \`grenztanken-$TAG.apk\` tippen und herunterladen.
          2. Datei öffnen. Android fragt einmal, ob der Browser Apps installieren darf: erlauben.
          3. In der App unter *Einstellungen* einen eigenen Tankerkönig-Schlüssel eintragen.
             Er ist **kostenlos** und schnell beantragt: https://onboarding.tankerkoenig.de/

          Updates installieren sich über die bisherige Version, die Einstellungen bleiben erhalten.
          Mehr zur App: https://github.com/${{ github.repository }}
          EOF

      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "grenztanken-$TAG.apk" grenztanken.apk --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" "grenztanken-$TAG.apk" grenztanken.apk --title "Grenztanken $TAG" \
              --notes-file notes.md --generate-notes --target "$GITHUB_SHA"
          fi
